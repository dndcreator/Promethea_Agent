name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            coverage: true
          - os: windows-latest
            coverage: false
          - os: macos-latest
            coverage: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linux sandbox provider
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        if: matrix.coverage == false
        run: python tests/run_all_tests.py --suite full --timeout 600 --output .tmp/evaluations/ci

      - name: Run tests with coverage
        if: matrix.coverage == true
        run: python tests/run_all_tests.py --suite full --coverage --timeout 600 --output .tmp/evaluations/ci

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ runner.os }}
          path: .tmp/evaluations/ci/

  typescript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            UI/package-lock.json

      - name: Install contract generator dependencies
        run: python -m pip install "pydantic>=2.5.0"

      - name: Verify TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run generate:check
          npm run typecheck
          npm test

      - name: Verify React UI
        working-directory: UI
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install existing test dependencies
        run: |
          pip install -e .[dev]
          python -m playwright install --with-deps chromium
          npm --prefix sdk/typescript ci
          npm --prefix UI ci
      - name: Source-fixture browser regression
        env:
          CANVAS_TEST_BROWSER_CHANNEL: chromium
          PROMETHEA_UI_TEST_URL: http://127.0.0.1:5186
        run: |
          mkdir -p .tmp/evaluations/browser
          npm --prefix UI run dev -- --host 127.0.0.1 --port 5186 --strictPort > .tmp/evaluations/browser/vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          timeout 90 bash -c 'until curl -fsS http://127.0.0.1:5186/tests/message-content.html > /dev/null; do sleep 1; done'
          python -m pytest -q tests/test_chat_steering_browser.py tests/test_chat_runtime_browser.py --junitxml=.tmp/evaluations/browser/results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: .tmp/evaluations/browser/
